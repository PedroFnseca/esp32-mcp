name: Automated Tests & Verification

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  arduino-lint:
    name: Arduino Lint Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Arduino Lint
        uses: arduino/arduino-lint-action@v1
        with:
          library-manager: update
          compliance: strict

  native-tests:
    name: PlatformIO Native Unit Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-platformio-${{ hashFiles('**/platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-platformio-

      - name: Install PlatformIO Core
        run: |
          pip install --upgrade platformio

      - name: Run Unity Tests
        run: |
          pio test -e native

  esp32-compile:
    name: ESP32 Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-platformio-${{ hashFiles('**/platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-platformio-

      - name: Install PlatformIO Core
        run: |
          pip install --upgrade platformio

      - name: Build Examples for ESP32
        run: |
          pio ci --board=esp32dev --lib="." examples/01_BasicServer/01_BasicServer.ino
          pio ci --board=esp32dev --lib="." examples/02_LedControl/02_LedControl.ino
          pio ci --board=esp32dev --lib="." examples/03_SensorReading/03_SensorReading.ino
          pio ci --board=esp32dev --lib="." examples/04_StructuredData/04_StructuredData.ino
          pio ci --board=esp32dev --lib="." examples/05_SecureServer/05_SecureServer.ino
          pio ci --board=esp32dev --lib="." examples/06_PerformanceTest/06_PerformanceTest.ino

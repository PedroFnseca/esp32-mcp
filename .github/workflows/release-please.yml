name: Release Please

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      prs_created: ${{ steps.release.outputs.prs_created }}
      pr: ${{ steps.release.outputs.pr }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  sync-properties:
    runs-on: ubuntu-latest
    needs: release-please
    if: ${{ needs.release-please.outputs.prs_created == 'true' }}
    steps:
      - name: Extract PR branch name
        id: branch
        run: |
          HEAD_BRANCH=$(echo '${{ needs.release-please.outputs.pr }}' | jq -r '.headBranchName // empty')
          echo "head_branch=$HEAD_BRANCH" >> "$GITHUB_OUTPUT"

      - name: Checkout PR branch
        if: ${{ steps.branch.outputs.head_branch != '' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.branch.outputs.head_branch }}

      - name: Sync library.properties version
        if: ${{ steps.branch.outputs.head_branch != '' }}
        run: |
          NEW_VERSION=$(jq -r '."."' .release-please-manifest.json)
          sed -i -E "s/^version=[0-9]+\.[0-9]+\.[0-9]+/version=${NEW_VERSION}/" library.properties
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          if ! git diff --quiet library.properties; then
            git add library.properties
            git commit -m "chore: sync version in library.properties [skip ci]"
            git push origin HEAD:${{ steps.branch.outputs.head_branch }}
          fi

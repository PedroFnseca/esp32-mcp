[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
    -Wall
    -Wextra

[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_flags =
    -std=c++14
    -Wall
    -Wextra
    -Itest/mock
    -Isrc
